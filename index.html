<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Split group trip expenses and see who pays whom." />
    <meta name="theme-color" content="#f3ecdf" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
    <title>Who owes whom</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var root = document.documentElement;
        var theme = "system";
        var lang = "en";
        var urlLang = "";
        try {
          urlLang = (new URLSearchParams(location.search).get("lang") || "").toLowerCase();
        } catch (e) {}
        if (urlLang === "en" || urlLang === "he" || urlLang === "ru") lang = urlLang;
        try {
          var storedTheme = localStorage.getItem("trip-split:theme");
          if (storedTheme === "light" || storedTheme === "dark" || storedTheme === "system") theme = storedTheme;
          if (urlLang !== "en" && urlLang !== "he" && urlLang !== "ru") {
            var storedLang = localStorage.getItem("trip-split:lang");
            if (storedLang === "he" || storedLang === "ru") lang = storedLang;
          }
        } catch (e) {}
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = theme === "dark" || (theme === "system" && systemDark);
        root.dataset.theme = theme;
        root.dataset.resolved = dark ? "dark" : "light";
        root.style.colorScheme = dark ? "dark" : "light";
        root.lang = lang;
        root.dir = lang === "he" ? "rtl" : "ltr";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
